[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "illustrator-agent"
version = "0.1.0.dev0"
description = "Agent workflows and reusable design components for editable Illustrator artwork."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "illustrator-agent contributors" },
]
dependencies = [
  "py-ai-illustrator>=0.1.0.dev0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
]

[tool.uv.sources]
py-ai-illustrator = { path = "../py-ai-illustrator", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/illustrator_agent"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
